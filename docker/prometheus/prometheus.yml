global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: bot_scalp_x
    static_configs:
      - targets: ["app:8001"]
    metrics_path: /metrics

  - job_name: dashboard
    static_configs:
      - targets: ["dashboard:8000"]
    metrics_path: /metrics

  - job_name: postgres
    static_configs:
      - targets: ["postgres:5432"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
