[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-scalp-x"
version = "0.1.0"
description = "AI-assisted scalping bot for XAUUSD, NAS100, EURUSD"
requires-python = ">=3.11"
dependencies = [
    "uvloop>=0.19.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis[hiredis]>=5.0.1",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "xgboost>=2.0.3",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.2",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "apscheduler>=3.10.4",
    "pyarrow>=15.0.0",
    "pyyaml>=6.0.1",
    # Research integrations
    "ta-lib>=0.6.0",            # 150+ battle-tested indicators via TA-Lib C library (ATR, EMA, RSI, ROC, VWAP)
    "quantstats>=0.0.62",       # HTML tearsheet reports (Sharpe, Calmar, drawdown, heatmaps)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "httpx>=0.27.0",
]
backtest = [
    "jupyter>=1.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "quantstats>=0.0.62",
]
# pip install -e ".[optimize]"  — vectorbt for fast signal parameter grid search
optimize = [
    "vectorbt>=0.28.0",
    "numba>=0.59.0",
]
# pip install -e ".[live]"  — aiomql async MT5 wrapper (Windows only)
live = [
    "aiomql>=2.0.0",
]

[project.scripts]
bot-scalp-x = "bot_scalp_x.orchestrator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast unit tests, no I/O",
    "integration: requires postgres and redis",
    "backtest: tick-replay backtests",
    "sandbox: MT5 connectivity tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["N999"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
